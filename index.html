<!DOCTYPE html>

<html lang="ja" style="background:#1c1c1e">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加速タイマー</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
background-color: #1c1c1e;
}

body {
color: #ffffff;
font-family: ‘Noto Sans JP’, -apple-system, sans-serif;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
overflow-y: auto;
overflow-x: hidden;
padding: 48px 16px 60px;
background-color: #1c1c1e;
}

.container {
width: 100%;
max-width: 460px;
}

.header {
text-align: center;
margin-bottom: 28px;
}

.title {
font-size: 17px;
font-weight: 600;
color: #ffffff;
letter-spacing: 0.3px;
}

.subtitle {
font-size: 13px;
color: #8e8e93;
margin-top: 4px;
}

.card {
background-color: #2c2c2e;
border-radius: 14px;
padding: 20px;
margin-bottom: 12px;
}

.card-label {
font-size: 12px;
color: #8e8e93;
font-weight: 500;
letter-spacing: 0.5px;
margin-bottom: 14px;
text-transform: uppercase;
}

.input-row {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 14px;
}

.field-label {
font-size: 12px;
color: #8e8e93;
margin-bottom: 6px;
}

.input-box {
background-color: #3a3a3c;
border-radius: 10px;
display: flex;
align-items: center;
padding: 12px 14px;
gap: 6px;
}

.input-box input {
background: none;
border: none;
outline: none;
color: #ffffff;
font-family: inherit;
font-size: 22px;
font-weight: 300;
width: 100%;
-webkit-appearance: none;
}

.input-box .unit {
font-size: 13px;
color: #8e8e93;
flex-shrink: 0;
}

.ratio-row {
background-color: #3a3a3c;
border-radius: 10px;
padding: 12px 14px;
display: flex;
align-items: center;
justify-content: space-between;
}

.ratio-row .label { font-size: 13px; color: #8e8e93; }
.ratio-row .value { font-size: 15px; font-weight: 600; color: #4a9eff; }

.ratio-bar-wrap {
height: 3px;
background-color: #3a3a3c;
border-radius: 99px;
margin-top: 10px;
overflow: hidden;
}

.ratio-bar {
height: 100%;
background-color: #4a9eff;
border-radius: 99px;
transition: width 0.3s ease;
}

.timer-card {
background-color: #2c2c2e;
border-radius: 14px;
padding: 28px 20px 20px;
margin-bottom: 12px;
text-align: center;
position: relative;
overflow: hidden;
}

.timer-top-bar {
position: absolute;
top: 0; left: 0; right: 0;
height: 3px;
background-color: #4a9eff;
border-radius: 14px 14px 0 0;
opacity: 0;
transition: opacity 0.4s;
}

.timer-card.running .timer-top-bar { opacity: 1; }

.disp-label {
font-size: 12px;
color: #8e8e93;
letter-spacing: 0.5px;
margin-bottom: 8px;
text-transform: uppercase;
}

.time-main {
font-size: clamp(68px, 20vw, 96px);
font-weight: 200;
line-height: 1;
letter-spacing: -2px;
color: #ffffff;
transition: color 0.4s;
font-variant-numeric: tabular-nums;
}

.time-main.danger { color: #ff6b6b; }

.real-badge {
display: inline-flex;
align-items: center;
gap: 8px;
margin-top: 14px;
background-color: #3a3a3c;
border-radius: 20px;
padding: 7px 16px;
font-size: 13px;
color: #8e8e93;
}

.real-badge .real-val {
color: #ffffff;
font-weight: 500;
}

.live-dot {
width: 6px; height: 6px;
border-radius: 50%;
background-color: #636366;
flex-shrink: 0;
}

.live-dot.on {
background-color: #32d74b;
box-shadow: 0 0 6px #32d74b;
animation: blink 1.2s ease-in-out infinite;
}

@keyframes blink {
0%,100% { opacity: 1; }
50% { opacity: 0.3; }
}

.progress-wrap {
margin-top: 18px;
height: 4px;
background-color: #3a3a3c;
border-radius: 99px;
overflow: hidden;
}

.progress-bar {
height: 100%;
background-color: #4a9eff;
border-radius: 99px;
width: 0%;
transition: width 0.5s linear;
}

.controls {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 12px;
}

.btn {
border: none;
border-radius: 12px;
font-family: inherit;
font-size: 15px;
font-weight: 500;
padding: 16px;
cursor: pointer;
transition: opacity 0.15s, transform 0.1s;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
-webkit-tap-highlight-color: transparent;
}

.btn:active:not(:disabled) { transform: scale(0.96); opacity: 0.8; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-primary {
background-color: #4a9eff;
color: #ffffff;
}

.btn-secondary {
background-color: #2c2c2e;
color: #ffffff;
}

.btn-lap {
background-color: #2c2c2e;
color: #32d74b;
grid-column: span 2;
}

.lap-section { display: none; margin-bottom: 12px; }
.lap-section.visible { display: block; }

.lap-col-heads {
display: grid;
grid-template-columns: 40px 1fr 1fr 1fr;
gap: 8px;
padding: 0 4px 8px;
}

.lap-col-head {
font-size: 11px;
color: #8e8e93;
text-align: right;
}
.lap-col-head:first-child { text-align: left; }

.lap-list { display: flex; flex-direction: column; gap: 8px; }

.lap-item {
background-color: #2c2c2e;
border-radius: 12px;
padding: 12px 14px;
display: grid;
grid-template-columns: 40px 1fr 1fr 1fr;
align-items: center;
gap: 8px;
animation: lapIn 0.2s ease;
}

@keyframes lapIn {
from { opacity: 0; transform: translateY(-6px); }
to   { opacity: 1; transform: translateY(0); }
}

.lap-num { font-size: 12px; font-weight: 600; color: #4a9eff; }
.lap-name { font-size: 13px; color: #ebebf5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.lap-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.lap-disp { font-size: 14px; font-weight: 500; color: #ffffff; font-variant-numeric: tabular-nums; }
.lap-real { font-size: 11px; color: #8e8e93; font-variant-numeric: tabular-nums; }

.modal-backdrop {
display: none;
position: fixed;
inset: 0;
background: rgba(0,0,0,0.7);
z-index: 50;
align-items: flex-end;
justify-content: center;
padding: 0 16px 20px;
backdrop-filter: blur(4px);
-webkit-backdrop-filter: blur(4px);
}
.modal-backdrop.show { display: flex; }

.modal {
background-color: #2c2c2e;
border-radius: 16px;
padding: 24px 20px;
width: 100%;
max-width: 440px;
animation: slideUp 0.25s ease;
}

@keyframes slideUp {
from { transform: translateY(20px); opacity: 0; }
to   { transform: translateY(0); opacity: 1; }
}

.modal-title { font-size: 13px; color: #8e8e93; margin-bottom: 14px; }

.modal-input {
width: 100%;
background-color: #3a3a3c;
border: none;
border-radius: 10px;
color: #ffffff;
font-family: inherit;
font-size: 17px;
padding: 14px;
outline: none;
margin-bottom: 14px;
-webkit-appearance: none;
}

.modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.finished-overlay {
display: none;
position: fixed;
inset: 0;
background-color: rgba(28,28,30,0.97);
z-index: 100;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 32px 20px;
overflow-y: auto;
text-align: center;
gap: 16px;
}
.finished-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.finished-title { font-size: 52px; font-weight: 700; color: #ffffff; letter-spacing: -1px; }
.finished-sub { font-size: 15px; color: #8e8e93; }

.finished-stats {
background-color: #2c2c2e;
border-radius: 14px;
padding: 18px 20px;
width: 100%;
max-width: 400px;
text-align: left;
font-size: 14px;
line-height: 2;
color: #ebebf5;
}
.finished-stats .hl { color: #4a9eff; font-weight: 600; }

.finished-laps { width: 100%; max-width: 400px; text-align: left; }
.finished-lap-head { font-size: 12px; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

.finished-lap-item {
background-color: #2c2c2e;
border-radius: 12px;
padding: 12px 14px;
display: grid;
grid-template-columns: 40px 1fr 1fr 1fr;
gap: 8px;
margin-bottom: 8px;
align-items: center;
font-size: 13px;
color: #ffffff;
}
</style>

</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">加速タイマー</div>
    <div class="subtitle">表示時間 ≠ 実際の時間</div>
  </div>

  <div class="card" id="setupPanel">
    <div class="card-label">設定</div>
    <div class="input-row">
      <div>
        <div class="field-label">表示する時間（試験）</div>
        <div class="input-box">
          <input type="number" id="displayMin" value="60" min="1" max="600" inputmode="numeric">
          <span class="unit">分</span>
        </div>
      </div>
      <div>
        <div class="field-label">実際の時間</div>
        <div class="input-box">
          <input type="number" id="realMin" value="50" min="1" max="600" inputmode="numeric">
          <span class="unit">分</span>
        </div>
      </div>
    </div>
    <div class="ratio-row">
      <span class="label">加速率</span>
      <span class="value" id="ratioValue">1.20×</span>
    </div>
    <div class="ratio-bar-wrap">
      <div class="ratio-bar" id="ratioBar" style="width:20%"></div>
    </div>
  </div>

  <div class="timer-card" id="timerDisplay">
    <div class="timer-top-bar"></div>
    <div class="disp-label">残り時間</div>
    <div class="time-main" id="timeDisplay">60:00</div>
    <div class="real-badge">
      <div class="live-dot" id="liveDot"></div>
      実時間　<span class="real-val" id="realTimeDisplay">50:00</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn" onclick="startTimer()">▶ スタート</button>
    <button class="btn btn-secondary" onclick="resetTimer()">↺ リセット</button>
    <button class="btn btn-lap" id="lapBtn" onclick="openLapModal()" disabled>⏱ ラップ</button>
  </div>

  <div class="lap-section" id="lapSection">
    <div class="lap-col-heads">
      <div class="lap-col-head"></div>
      <div class="lap-col-head"></div>
      <div class="lap-col-head">経過（表示）</div>
      <div class="lap-col-head">区間タイム</div>
    </div>
    <div class="lap-list" id="lapList"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-title">区間名を入力</div>
    <input class="modal-input" id="lapNameInput" type="text" placeholder="大問1" maxlength="20">
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="recordLap()">記録</button>
    </div>
  </div>
</div>

<div class="finished-overlay" id="finishedOverlay">
  <div class="finished-title">終了</div>
  <div class="finished-sub">お疲れ様でした</div>
  <div class="finished-stats" id="finishedStats"></div>
  <div class="finished-laps" id="finishedLaps"></div>
  <button class="btn btn-secondary" onclick="closeFinished()" style="margin-top:8px;padding:16px 40px;">← もどる</button>
</div>

<script>
  let timer = null, running = false, paused = false;
  let displayTotalMs = 0, realTotalMs = 0, elapsedRealMs = 0, lastTick = null;
  let laps = [], lastLapRealMs = 0, lastLapDispMs = 0;
  let pendingLapRealMs = 0, pendingLapDispMs = 0;

  const displayMinEl = document.getElementById('displayMin');
  const realMinEl = document.getElementById('realMin');
  const ratioValueEl = document.getElementById('ratioValue');
  const ratioBarEl = document.getElementById('ratioBar');
  const timeDisplayEl = document.getElementById('timeDisplay');
  const realTimeDisplayEl = document.getElementById('realTimeDisplay');
  const progressBarEl = document.getElementById('progressBar');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const timerCard = document.getElementById('timerDisplay');
  const liveDot = document.getElementById('liveDot');
  const setupPanel = document.getElementById('setupPanel');
  const lapSection = document.getElementById('lapSection');
  const lapList = document.getElementById('lapList');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const lapNameInput = document.getElementById('lapNameInput');

  function updateRatio() {
    const d = parseFloat(displayMinEl.value) || 60;
    const r = parseFloat(realMinEl.value) || 50;
    const ratio = d / r;
    ratioValueEl.textContent = ratio.toFixed(2) + '×';
    ratioBarEl.style.width = Math.min(((ratio - 1) / 1) * 100, 100) + '%';
  }

  displayMinEl.addEventListener('input', () => { updateRatio(); syncDisplay(); });
  realMinEl.addEventListener('input', () => { updateRatio(); syncDisplay(); });

  function syncDisplay() {
    if (running || paused) return;
    timeDisplayEl.textContent = formatTime((parseFloat(displayMinEl.value)||60)*60000);
    realTimeDisplayEl.textContent = formatTime((parseFloat(realMinEl.value)||50)*60000);
  }

  function formatTime(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }

  function startTimer() {
    if (!running && !paused) {
      displayTotalMs = (parseFloat(displayMinEl.value)||60)*60000;
      realTotalMs    = (parseFloat(realMinEl.value)||50)*60000;
      elapsedRealMs  = 0;
      laps = []; lastLapRealMs = 0; lastLapDispMs = 0;
      lapList.innerHTML = '';
      lapSection.classList.remove('visible');
      setupPanel.style.opacity = '0.4';
      setupPanel.style.pointerEvents = 'none';
    }
    running = true; paused = false;
    lastTick = performance.now();
    startBtn.textContent = '⏸ 一時停止';
    startBtn.onclick = pauseTimer;
    lapBtn.disabled = false;
    timerCard.classList.add('running');
    liveDot.classList.add('on');
    tick();
  }

  function tick() {
    if (!running) return;
    const now = performance.now();
    elapsedRealMs = Math.min(elapsedRealMs + (now - lastTick), realTotalMs);
    lastTick = now;
    const ratio = displayTotalMs / realTotalMs;
    const remDisp = Math.max(0, displayTotalMs - elapsedRealMs * ratio);
    const remReal = Math.max(0, realTotalMs - elapsedRealMs);
    timeDisplayEl.textContent = formatTime(remDisp);
    realTimeDisplayEl.textContent = formatTime(remReal);
    progressBarEl.style.width = (elapsedRealMs / realTotalMs * 100) + '%';
    timeDisplayEl.classList.toggle('danger', remDisp < displayTotalMs * 0.1);
    if (elapsedRealMs >= realTotalMs) { finish(); return; }
    timer = requestAnimationFrame(tick);
  }

  function pauseTimer() {
    running = false; paused = true;
    cancelAnimationFrame(timer);
    startBtn.textContent = '▶ 再開';
    startBtn.onclick = startTimer;
    timerCard.classList.remove('running');
    liveDot.classList.remove('on');
  }

  function resetTimer() {
    running = false; paused = false;
    cancelAnimationFrame(timer);
    elapsedRealMs = 0; laps = []; lastLapRealMs = 0; lastLapDispMs = 0;
    startBtn.textContent = '▶ スタート';
    startBtn.onclick = startTimer;
    lapBtn.disabled = true;
    timerCard.classList.remove('running');
    liveDot.classList.remove('on');
    timeDisplayEl.classList.remove('danger');
    progressBarEl.style.width = '0%';
    setupPanel.style.opacity = '';
    setupPanel.style.pointerEvents = '';
    lapList.innerHTML = '';
    lapSection.classList.remove('visible');
    syncDisplay();
  }

  function openLapModal() {
    if (!running && !paused) return;
    const ratio = displayTotalMs / realTotalMs;
    pendingLapRealMs = elapsedRealMs;
    pendingLapDispMs = elapsedRealMs * ratio;
    lapNameInput.value = '大問' + (laps.length + 1);
    modalBackdrop.classList.add('show');
    setTimeout(() => lapNameInput.focus(), 100);
  }

  function closeModal() { modalBackdrop.classList.remove('show'); }

  lapNameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') recordLap();
    if (e.key === 'Escape') closeModal();
  });

  function recordLap() {
    const name = lapNameInput.value.trim() || ('大問' + (laps.length + 1));
    closeModal();
    const lap = {
      num: laps.length + 1, name,
      totalDisp: pendingLapDispMs, totalReal: pendingLapRealMs,
      splitDisp: pendingLapDispMs - lastLapDispMs,
      splitReal: pendingLapRealMs - lastLapRealMs,
    };
    laps.push(lap);
    lastLapDispMs = pendingLapDispMs;
    lastLapRealMs = pendingLapRealMs;
    renderLap(lap);
    lapSection.classList.add('visible');
  }

  function renderLap(lap) {
    const el = document.createElement('div');
    el.className = 'lap-item';
    el.innerHTML = `
      <div class="lap-num">L${lap.num}</div>
      <div class="lap-name">${esc(lap.name)}</div>
      <div class="lap-cell">
        <div class="lap-disp">${formatTime(lap.totalDisp)}</div>
        <div class="lap-real">実 ${formatTime(lap.totalReal)}</div>
      </div>
      <div class="lap-cell">
        <div class="lap-disp">${formatTime(lap.splitDisp)}</div>
        <div class="lap-real">実 ${formatTime(lap.splitReal)}</div>
      </div>`;
    lapList.prepend(el);
  }

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function finish() {
    running = false;
    cancelAnimationFrame(timer);
    timerCard.classList.remove('running');
    liveDot.classList.remove('on');
    lapBtn.disabled = true;
    const dMin = (displayTotalMs/60000).toFixed(0);
    const rMin = (realTotalMs/60000).toFixed(0);
    const ratio = (displayTotalMs/realTotalMs).toFixed(2);
    const saved = Math.round((displayTotalMs - realTotalMs)/1000);
    document.getElementById('finishedStats').innerHTML =
      `表示時間：<span class="hl">${dMin} 分</span><br>` +
      `実際の時間：<span class="hl">${rMin} 分</span><br>` +
      `加速率：<span class="hl">${ratio}×</span><br>` +
      `短縮時間：<span class="hl">${Math.floor(saved/60)}分 ${saved%60}秒</span>`;
    const fl = document.getElementById('finishedLaps');
    fl.innerHTML = '';
    if (laps.length > 0) {
      const h = document.createElement('div');
      h.className = 'finished-lap-head';
      h.textContent = 'ラップ記録';
      fl.appendChild(h);
      laps.forEach(lap => {
        const row = document.createElement('div');
        row.className = 'finished-lap-item';
        row.innerHTML = `
          <span style="color:#4a9eff;font-weight:600">L${lap.num}</span>
          <span style="color:#ebebf5">${esc(lap.name)}</span>
          <span style="text-align:right">${formatTime(lap.totalDisp)}<br><span style="color:#8e8e93;font-size:11px">実 ${formatTime(lap.totalReal)}</span></span>
          <span style="text-align:right">${formatTime(lap.splitDisp)}<br><span style="color:#8e8e93;font-size:11px">実 ${formatTime(lap.splitReal)}</span></span>`;
        fl.appendChild(row);
      });
    }
    document.getElementById('finishedOverlay').classList.add('show');
  }

  function closeFinished() {
    document.getElementById('finishedOverlay').classList.remove('show');
    resetTimer();
  }

  updateRatio();
  syncDisplay();
</script>

</body>
</html>
